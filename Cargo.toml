[workspace]
members = [
    "contracts/*",
    "packages/*",
]
resolver = "2"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[workspace.dependencies]
soroban-sdk = "20.0.0"
