[package]
name = "soroban-sas-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
soroban-sas-common = { path = "../soroban-sas-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
